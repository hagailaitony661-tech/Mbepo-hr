.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}.tabs button{flex:none;border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:6px 11px;cursor:pointer}

.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.kv small{color:var(--mut);display:block;font-size:12px}
.empty{text-align:center;color:var(--mut);padding:24px}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.md{background:var(--card);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}

.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.fg label{font-size:12px;color:var(--mut)}
.ck{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.ck input{width:auto}

.grid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat{display:flex;gap:12px;align-items:center;border-left:4px solid var(--a,#10b981);padding:14px}.stat i{font-style:normal;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:color-mix(in srgb,var(--a,#10b981) 16%,transparent);flex:none}.stat b{font-size:24px;line-height:1.1}

.b{background:linear-gradient(135deg,var(--pri),#16a34a);box-shadow:0 4px 12px #0f7a4a40;transition:.15s}.b:hover{transform:translateY(-1px)}.b.g{background:var(--pri2);box-shadow:none}.b.r{background:#fde8e6;box-shadow:none}
tr:hover td{background:var(--pri2)}th{font-size:12px;text-transform:uppercase;letter-spacing:.4px}.hero{border-radius:var(--r);box-shadow:var(--sh)}
@media(max-width:700px){header nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;box-shadow:0 -6px 20px #0002;gap:4px;flex-wrap:nowrap}header nav button.b.g{flex:1;background:transparent;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 2px;border-radius:12px}header nav button i{font-size:20px;margin:0}header nav button.b.g.on{background:var(--pri2);color:var(--pri)}main{padding-bottom:96px}.wel h1{font-size:19px}}

.wel{position:relative;overflow:hidden}.wel>div:not(.kb){position:relative;z-index:2}
.kb,.wv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.kb{inset:-6%;width:112%;height:112%;background:var(--bus) center/cover;animation:kb 16s ease-in-out infinite alternate}
body.mb .wel::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(6,18,10,.88),rgba(6,18,10,.45) 55%,rgba(6,18,10,.12))}
body:not(.mb) .kb,body:not(.mb) .wv{display:none}
@keyframes kb{from{transform:scale(1) translateX(-2.5%)}to{transform:scale(1.1) translateX(2.5%)}}
@media(prefers-reduced-motion:reduce){.kb{animation:none}}
.wel{align-items:center;gap:18px}.wl{flex:1;min-width:240px}
.vp{display:flex;gap:12px;flex:none}.vp video{width:190px;height:332px;object-fit:cover;border-radius:16px;border:2px solid rgba(246,215,122,.8);box-shadow:0 10px 28px rgba(0,0,0,.5);background:#000 var(--bus) center/cover}
@media(max-width:700px){.wel{flex-direction:column;align-items:stretch}.vp{width:100%}.vp video{flex:1;min-width:0;width:calc(50% - 6px);height:auto;aspect-ratio:9/14}}
.wl .pill{display:inline-block;margin-top:10px}
@media(max-width:700px){header b{font-size:14px;letter-spacing:.5px}header small{display:none}.brand{gap:8px}header{padding:10px 12px}}

const idB=e=>{const m=MB(),p=e.per||{};return `<div style="position:relative;width:510px;height:322px;overflow:hidden;border-radius:18px;font-family:Arial,Helvetica,sans-serif;color:#fff;border:2px solid #0b3d2a;box-sizing:border-box;background:#0b3d2a;padding:14px 16px"><div style="display:flex;align-items:center">${m?`<img src="${IMG.logo}" style="height:100px;width:100px;object-fit:contain;background:#fff;border-radius:14px;padding:4px;margin-right:14px;flex:none"/>`:''}<div><div style="font-size:22px;font-weight:700;color:#f6d77a">${esc(D.co)}</div>${m?'<div style="font-size:10px;letter-spacing:2px">DAR ES SALAAM \u21c4 MBALIZI \u21c4 MBEYA</div>':''}<div style="font-size:15px;font-weight:700;font-style:italic;color:#fff;margin-top:7px;line-height:1.25">\u201c${m?'Safari Salama, Huduma ya Kifalme':'Ubora na Huduma Bora Kila Siku'}\u201d</div><div style="font-size:10.5px;color:#f6d77a;margin-top:3px">${m?'Mteja ni Mfalme \u00b7 Kila Safari ni Ahadi \u00b7 Tunakufikisha Salama':'Mteja Kwanza \u00b7 Ahadi Yetu \u00b7 Mafanikio Yako'}</div></div></div>${m?`<div style="display:flex;margin-top:10px"><img src="${IMG.b1}" style="width:226px;height:116px;object-fit:cover;border-radius:10px;border:2px solid #b8860b;margin-right:12px"/><img src="${IMG.b2}" style="width:226px;height:116px;object-fit:cover;border-radius:10px;border:2px solid #b8860b"/></div>`:''}<div style="font-size:10.5px;margin-top:8px;color:#e9dcae;text-align:center;line-height:1.35">Kadi hii ni mali ya kampuni. Ukiipata tafadhali irudishe.<br/>Dharura / Emergency: ${esc(p.ecp)} ${esc(p.ecn)} \u00b7 Tel: ${esc(e.phone)}</div></div>`};
const idBoth=e=>`<div style="width:510px">${idF(e)}<div style="height:16px;background:#fff"></div>${idB(e)}</div>`;
function showID(id){const e=E(id);docModal(idBoth(e),510,660,4,'ID-'+e.id+'.png')}
function printID(id){prt(`<div style="zoom:.64">${idBoth(E(id))}</div>`)}
function idAll(){prt('<div style="zoom:.64">'+D.e.map(idBoth).join('<div style="height:24px"></div>')+'</div>')}
const CT={uhamisho:['CHETI CHA UHAMISHO','Transfer Certificate'],pongezi:['CHETI CHA PONGEZI','Certificate of Commendation'],shukrani:['CHETI CHA SHUKRANI','Certificate of Appreciation'],utumishi:['CHETI CHA UTUMISHI','Certificate of Service'],mafunzo:['CHETI CHA MAFUNZO NA MAFANIKIO','Training & Achievement Certificate'],bidii:['CHETI CHA KUFANYA KAZI KWA BIDII','Hard Work Certificate']};
const CD={uhamisho:'amehamishwa kikazi.',pongezi:'kwa juhudi, uaminifu na utendaji mzuri wa kazi.',shukrani:'kwa kuthamini mchango wake mkubwa katika kampuni.',utumishi:'kwa kuthibitisha utumishi wake katika kampuni.',mafunzo:'kwa kushiriki mafunzo na kupata mafanikio.',bidii:'kwa kufanya kazi kwa bidii, nidhamu na kujituma.'};
const CE={uhamisho:['🚌','🧳'],pongezi:['🎊','💐'],shukrani:['💐','🙏'],utumishi:['🏅','🎖️'],mafunzo:['🎓','📚'],bidii:['🏆','💪']};
const crtH=c=>{const e=E(c.emp)||{first:'?',last:'',pos:'',dept:'',hired:''},m=MB(),t=CT[c.type]||CT.pongezi,em=CE[c.type]||CE.pongezi,pic=c.photo||e.photo,bd=c.type==='uhamisho'?`Anahamishwa kutoka <b>${esc(c.from||'-')}</b> kwenda <b>${esc(c.to||'-')}</b>.`:c.type==='utumishi'?`Ameajiriwa tangu <b>${esc(e.hired)}</b> kama <b>${esc(e.pos)}</b>.`:'';
return `<div style="position:relative;width:1123px;height:794px;overflow:hidden;background:#fffdf5;font-family:Georgia,'Times New Roman',serif;color:#2a1f05;text-align:center;box-sizing:border-box"><div style="position:absolute;left:14px;top:14px;right:14px;bottom:14px;border:6px double #b8860b"></div><div style="position:absolute;left:34px;top:34px;right:34px;bottom:34px;border:2px solid #b8860b"></div>${m?`<img src="${IMG.logo}" style="position:absolute;left:50%;top:50%;width:420px;margin:-220px 0 0 -210px;opacity:.07"/><div style="position:absolute;left:36px;right:36px;bottom:36px;height:96px;background:linear-gradient(rgba(255,253,245,.35),rgba(255,253,245,.1)),url(${IMG.b2}) center 55%/cover;opacity:.6"></div>`:''}<div style="position:relative;padding-top:40px"><div style="font-size:22px;letter-spacing:10px">🎉✨🎊✨🎉</div>${m?`<img src="${IMG.logo}" style="height:70px;margin-top:4px"/>`:''}<div style="font-size:24px;font-weight:700;letter-spacing:3px;color:#7a5a0a">${esc(D.co)}</div><div style="font-size:40px;font-weight:700;margin-top:4px;color:#14502f;letter-spacing:2px">${t[0]}</div><div style="font-size:14px;letter-spacing:4px;color:#7a5a0a">${t[1].toUpperCase()}</div><div style="display:flex;justify-content:center;align-items:center;margin-top:8px"><div style="font-size:64px;margin-right:34px">${em[0]}</div><div style="width:130px;height:130px;border-radius:50%;border:5px solid #b8860b;box-shadow:0 0 0 4px #fffdf5,0 0 0 6px #b8860b;overflow:hidden;background:#f4ecd2;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700">${pic?`<img src="${pic}" style="width:100%;height:100%;object-fit:cover"/>`:esc((e.first[0]||'')+(e.last[0]||''))}</div><div style="font-size:64px;margin-left:34px">${em[1]}</div></div><div style="font-size:17px;margin-top:8px">Kinatolewa kwa / Presented to</div><div style="font-size:46px;font-style:italic;font-weight:700;margin:2px 0;border-bottom:2px solid #b8860b;display:inline-block;padding:0 40px">${esc(nm(e))}</div><div style="font-size:18px;margin:8px 90px 0;line-height:1.45">${esc(e.pos)} \u00b7 ${esc(e.dept)}<br/>${esc(CD[c.type]||'')} ${bd}<br/>${X(c.detail||'')}</div></div><div style="position:absolute;left:90px;right:90px;bottom:146px;display:flex;justify-content:space-between;align-items:flex-end;font-size:15px"><div style="border-top:1px solid #2a1f05;padding-top:4px;width:240px">${esc(c.s1||'Meneja Mkuu')}</div><div>${esc(c.date)}<br/><small>No: ${c.no}</small></div><div style="border-top:1px solid #2a1f05;padding-top:4px;width:240px">${esc(c.s2||'Mkurugenzi')}</div></div></div>`};
function calc(x){const rows=String(x.items||'').split('\n').map(l=>l.split('|').map(a=>a.trim())).filter(a=>a[0]).map(a=>{const q=+a[1]||1,p=+String(a[2]||0).replace(/,/g,'')||0;return{d:a[0],q,p,t:q*p}}),sub=rows.reduce((a,r)=>a+r.t,0),vat=x.vat==='18%'?sub*.18:0;return{rows,sub,vat,total:sub+vat}}
const td1='padding:7px 8px;border-bottom:1px solid #ddd';
const invH=x=>{const c=calc(x),m=MB(),R=x.kind==='RCT';return `<div style="position:relative;width:794px;height:1123px;overflow:hidden;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#111;box-sizing:border-box;padding:40px 48px">${m?`<img src="${IMG.logo}" style="position:absolute;left:50%;top:44%;width:520px;margin-left:-260px;margin-top:-260px;opacity:.07"/><div style="position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,.15)),url(${IMG.b2}) center 50%/cover;border-top:4px solid #b8860b"></div>`:''}<div style="position:relative"><div style="display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #b8860b;padding-bottom:12px"><div style="display:flex;align-items:center">${m?`<img src="${IMG.logo}" style="height:78px;margin-right:14px"/>`:''}<div><div style="font-size:26px;font-weight:700;color:#0b3d2a">${esc(D.co)}</div>${m?'<div style="font-size:11px;letter-spacing:2px;color:#7a5a0a">DAR ES SALAAM \u21c4 MBALIZI \u21c4 MBEYA</div>':''}</div></div><div style="text-align:right"><div style="font-size:22px;font-weight:700;color:#7a5a0a">${R?'RECEIPT / RISITI':'INVOICE / ANKARA'}</div><div>No: <b>${x.no}</b></div><div>Date: ${esc(x.date)}</div></div></div><div style="margin:20px 0;font-size:14px"><b>Mteja / Customer:</b> ${esc(x.cust)}<br/>${esc(x.phone||'')} ${esc(x.addr||'')}</div><table style="width:100%;border-collapse:collapse;font-size:14px"><tr style="background:#0b3d2a;color:#f6d77a"><th style="text-align:left;padding:8px">#</th><th style="text-align:left;padding:8px">Maelezo / Description</th><th style="padding:8px">Qty</th><th style="text-align:right;padding:8px">Bei</th><th style="text-align:right;padding:8px">Jumla</th></tr>${c.rows.map((r,i)=>`<tr><td style="${td1}">${i+1}</td><td style="${td1}">${esc(r.d)}</td><td style="${td1};text-align:center">${r.q}</td><td style="${td1};text-align:right">${TZS(r.p)}</td><td style="${td1};text-align:right">${TZS(r.t)}</td></tr>`).join('')}</table><div style="text-align:right;margin-top:14px;font-size:15px">Subtotal: ${TZS(c.sub)}<br/>${c.vat?`VAT 18%: ${TZS(c.vat)}<br/>`:''}<span style="font-size:20px;font-weight:700;color:#0b3d2a">JUMLA / TOTAL: ${TZS(c.total)}</span></div><div style="margin-top:20px;font-size:13px">Malipo / Payment: <b>${esc(x.pay||'-')}</b> \u00b7 Hali: <b>${R||x.paid?'IMELIPWA / PAID':'HAIJALIPWA / UNPAID'}</b><br/>${X(x.note||'')}</div><div style="margin-top:46px;font-size:13px">Sahihi / Signature: ________________ &#160;&#160;&#160; Asante kwa kuchagua ${esc(D.co)}</div></div></div>`};
function newCert(){form('Toa cheti',[['emp','Mfanyakazi','sel',D.e.map(x=>[x.id,nm(x)])],['type','Aina ya cheti','sel',Object.keys(CT).map(k=>[k,CT[k][0]])],['photo','Picha ya anayepewa cheti (acha tupu = picha yake ya kawaida)','photo'],['detail','Maelezo ya ziada (hiari)','area'],['from','Kutoka (kwa uhamisho)'],['to','Kwenda (kwa uhamisho)'],['date','Tarehe','date'],['s1','Mtia saini 1'],['s2','Mtia saini 2']],{date:today(),s1:'Meneja Mkuu',s2:'Mkurugenzi'},o=>{if(!o.emp)return;o.no='CRT-'+String(++D.cn.CRT).padStart(4,'0');D.cert.push(o);setTimeout(()=>showCert(D.cert.length-1),80)})}
function showCert(i){const c=D.cert[i];docModal(crtH(c),1123,794,2.5,c.no+'.png','A4 landscape')}
function newInv(k){form(k==='RCT'?'Risiti mpya':'Invoice mpya',[['cust','Jina la mteja'],['phone','Simu'],['addr','Anwani'],['date','Tarehe','date'],['items','Bidhaa/huduma (kila mstari: maelezo | idadi | bei)','area'],['vat','VAT','sel',['Hapana','18%']],['pay','Njia ya malipo','sel',['Cash','M-Pesa','Tigo Pesa','Airtel Money','Bank']],['note','Maelezo ya ziada','area']],{date:today(),items:'Tiketi Dar - Mbeya | 1 | 55000'},o=>{if(!o.cust)return;o.kind=k;o.no=(k==='RCT'?'RCT-':'INV-')+String(++D.cn[k]).padStart(4,'0');o.paid=k==='RCT';D.inv.push(o);setTimeout(()=>showInv(D.inv.length-1),80)})}
function showInv(i){const x=D.inv[i];docModal(invH(x),794,1123,2.5,x.no+'.png','A4 portrait')}
function paid(i){D.inv[i].paid=true;save();render()}
function delDoc(k,i){ask('Futa hati hii?',()=>D[k].splice(i,1))}
function incChart(){const now=new Date(),ms=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);ms.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}const v=ms.map(m=>D.inv.filter(x=>(x.kind==='RCT'||x.paid)&&String(x.date).startsWith(m)).reduce((a,x)=>a+calc(x).total,0)),mx=Math.max(1,...v);return `<div class="w"><svg viewBox="0 0 420 190" style="width:100%;max-width:640px;display:block;margin:0 auto">${v.map((y,i)=>{const h=y/mx*130;return `<rect x="${30+i*62}" y="${150-h}" width="44" height="${h}" rx="4" fill="#d4af37"/><text x="${52+i*62}" y="${144-h}" font-size="9" text-anchor="middle" style="fill:var(--tx)">${y?Math.round(y/1000)+'K':''}</text><text x="${52+i*62}" y="170" font-size="10" text-anchor="middle" style="fill:var(--mut)">${ms[i].slice(2)}</text>`}).join('')}</svg></div>`}
function kpi(){const m=today().slice(0,7),inc=D.inv.filter(x=>(x.kind==='RCT'||x.paid)&&String(x.date).startsWith(m)).reduce((a,x)=>a+calc(x).total,0),pend=D.inv.filter(x=>x.kind==='INV'&&!x.paid).reduce((a,x)=>a+calc(x).total,0);return `<div class="grid"><div class="stat c1"><i>\ud83d\udcb0</i><div><b style="font-size:18px">${TZS(inc)}</b><span>Mapato mwezi huu</span></div></div><div class="stat c4"><i>\u23f3</i><div><b style="font-size:18px">${TZS(pend)}</b><span>Invoice zinasubiri</span></div></div><div class="stat c5"><i>\ud83c\udfc5</i><div><b>${D.cert.length}</b><span>Vyeti vilivyotolewa</span></div></div><div class="stat c2"><i>\ud83e\uddfe</i><div><b>${D.inv.length}</b><span>Invoice na risiti</span></div></div></div><div class="card" style="margin-top:12px"><h2>Mapato \u2014 miezi 6</h2>${incChart()}</div>`}
function docTab(k){const R=k==='RCT',L=D.inv.map((x,i)=>[x,i]).filter(([x])=>x.kind===k);return `<div class="card"><div class="row"><h2 style="margin:0">${R?'Risiti':'Invoice'}</h2><button class="b s" onclick="newInv('${k}')">+ ${R?'Risiti mpya':'Invoice mpya'}</button></div>${L.length?`<div class="w"><table><tr><th>No</th><th>Mteja</th><th>Jumla</th><th>Hali</th><th></th></tr>${L.map(([x,i])=>`<tr><td>${x.no}</td><td>${esc(x.cust)}</td><td>${TZS(calc(x).total)}</td><td>${x.paid?'<span class="tag">Imelipwa</span>':'<span class="tag p">Inasubiri</span>'}</td><td style="white-space:nowrap"><button class="b s" onclick="showInv(${i})">\u2b07 View/Download</button> ${!R&&!x.paid?`<button class="b g s" onclick="paid(${i})">Weka imelipwa</button> `:''}<button class="b r s" onclick="delDoc('inv',${i})">Delete</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Bado hakuna hati.</div>'}</div><div class="card"><h2>Mapato \u2014 miezi 6</h2>${incChart()}</div>`}
function certTab(){return `<div class="card"><div class="row"><h2 style="margin:0">Vyeti vilivyotolewa</h2><button class="b s" onclick="newCert()">+ Toa cheti</button></div>${D.cert.length?`<div class="w"><table><tr><th>No</th><th>Mfanyakazi</th><th>Aina</th><th>Tarehe</th><th></th></tr>${D.cert.map((c,i)=>`<tr><td>${c.no}</td><td>${esc(nm(E(c.emp)||{first:'?',last:''}))}</td><td>${(CT[c.type]||CT.pongezi)[0]}</td><td>${c.date}</td><td style="white-space:nowrap"><button class="b s" onclick="showCert(${i})">\u2b07 View/Download</button> <button class="b r s" onclick="delDoc('cert',${i})">Delete</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Bado hakuna cheti. Bonyeza + Toa cheti.</div>'}</div><div class="card"><h2>Aina za vyeti</h2><p style="color:var(--mut);margin:0">${Object.values(CT).map(x=>x[0]).join(' \u00b7 ')}</p></div>`}
function repv(){const t=S.dt||'cert',tb=(k,l)=>`<button class="b ${t===k?'':'g'} s" onclick="S.dt='${k}';render()">${l}</button>`;return `<div class="row"><h2 style="margin:0">Documents</h2></div><div class="f">${tb('cert','\ud83c\udfc5 Vyeti')}${tb('inv','\ud83e\uddfe Invoice')}${tb('rct','\ud83e\uddfe Risiti')}${tb('rep','\ud83d\udcca Ripoti')}</div>`+(t==='cert'?certTab():t==='inv'?docTab('INV'):t==='rct'?docTab('RCT'):repTab())}
function tg(r,v){E(S.id).req[r]=v;save();render()}
function arch(id){ask('Mark this employee as Inactive?',()=>E(id).status='Inactive')}
boot();try{if(gp()&&!sessionStorage.getItem('hr_ok'))lockUI()}catch(e){}
</script></body></html>
