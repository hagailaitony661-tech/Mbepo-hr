<script>
try{document.documentElement.dataset.theme=localStorage.getItem('hr_theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}
const REQS=['Application Form','Resume','Government IDs','NBI Clearance','Police Clearance','Medical Certificate','Pre-Employment Medical','Diploma','Transcript of Records','Birth Certificate','Employment Contract','Barangay Clearance'];
const ST=['Probationary','Regular','Inactive'],TY=['Full-Time','Part-Time','Contractual'];
const F={emp:[['first','First name'],['last','Last name'],['dept','Department'],['pos','Position'],['hired','Date hired','date'],['status','Status','sel',ST],['type','Employment type','sel',TY],['phone','Contact no.'],['email','Email'],['photo','Photo','photo']],
per:[['nick','Nickname'],['dob','Date of birth','date'],['pob','Place of birth'],['sex','Sex','sel',['Male','Female']],['civil','Civil status','sel',['Single','Married','Widowed']],['nat','Nationality'],['tribe','Tribe (Kabila)'],['blood','Blood type'],['addr','Residence (where he/she lives)'],['paddr','Permanent address'],['ecp','Emergency contact person'],['ecr','Relationship'],['ecn','Emergency contact no.']],
gov:[['sss','SSS number'],['phil','PhilHealth number'],['pag','Pag-IBIG number'],['tin','TIN'],['pass','Passport number'],['dl',"Driver's license number"]],
comp:[['sal','Basic salary'],['allow','Allowance'],['freq','Pay frequency','sel',['Monthly','Semi-monthly','Weekly']],['bank','Bank account']],
fam:[['name','Name'],['rel','Relationship'],['dob','Birth date','date'],['phone','Contact']],edu:[['school','School'],['level','Level / course'],['year','Year graduated']],
hist:[['co','Company'],['role','Position'],['period','Period']],docs:[['name','Document name'],['date','Date','date'],['note','Notes']],
memo:[['title','Title'],['date','Date','date'],['body','Details','area']],trn:[['title','Training'],['date','Date','date'],['status','Status','sel',['Scheduled','Completed']]]};
const TABS=[['Overview'],['Personal','per'],['Employment','emp'],['Compensation','comp'],['Government IDs','gov'],['Family','fam',1],['Education','edu',1],['Employment History','hist',1],['Requirements'],['Documents','docs',1],['Memos','memo',1],['Trainings','trn',1]];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D,S={v:'dash',id:null,tab:'Overview',q:'',dept:'',st:''};
try{D=JSON.parse(localStorage.getItem('hr201'))}catch(e){}
if(!D)D={n:3,e:[mk('EMP-2026-0001','Prince','Faji','GENERAL AFFAIRS','HR Manager','2026-09-17','Probationary'),mk('EMP-2026-0002','Mark','Santos','GENERAL AFFAIRS','HR Manager','2026-09-17','Probationary'),mk('EMP-2026-0003','Zack','Tan','GENERAL AFFAIRS','HR Manager','2026-09-22','Probationary')]};
function mk(id,first,last,dept,pos,hired,status){return{id,first,last,dept,pos,hired,status,type:'Full-Time',phone:'',email:'',per:{nat:'Tanzanian'},gov:{},comp:{},req:{},fam:[],edu:[],hist:[],docs:[],memo:[],trn:[]}}
D.co=D.co||'MBEPO EXPRESS LTD';D.att=D.att||{};D.e.forEach(x=>{x.per=x.per||{};if(x.per.nat===undefined)x.per.nat='Tanzanian'});
const save=()=>{try{localStorage.setItem('hr201',JSON.stringify(D))}catch(e){}};
const E=id=>D.e.find(x=>x.id===id),nm=e=>e.first+' '+e.last,miss=e=>REQS.filter(r=>!e.req[r]);
const tag=s=>`<span class="tag ${s==='Probationary'?'p':s==='Inactive'?'m':''}">${esc(s)}</span>`;
function go(v,id,tab){S.v=v;S.id=id||null;S.tab=tab||'Overview';render();scrollTo(0,0)}
function render(){$('#co').textContent=D.co;$('#lg').textContent=(D.co.trim()[0]||'M').toUpperCase();document.querySelectorAll('nav [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===(S.v==='prof'?'emps':S.v)));document.title=D.co;$('#app').innerHTML=S.v==='dash'?dash():S.v==='emps'?emps():S.v==='att'?attv():prof();if(S.v==='emps')list()}
function dash(){const e=D.e,act=e.filter(x=>x.status!=='Inactive').length,ms=e.flatMap(x=>miss(x).map(r=>[x,r])),dp=new Set(e.map(x=>x.dept)).size,nw=e.filter(x=>(Date.now()-new Date(x.hired))/864e5<=30).length;
const st=(n,l,i,c)=>`<div class="stat ${c}"><i>${i}</i><div><b>${n}</b><span>${l}</span></div></div>`,td=D.att[today()]||{},pr=Object.values(td).filter(v=>v==='P'||v==='L').length;
return `<div class="wel"><div><h1>Karibu, ${esc(D.co)}</h1><p>${new Date().toDateString()} · Mfumo wa wafanyakazi na mahudhurio</p></div><div class="pill">Present today: ${pr}/${act}</div></div><div class="grid">${st(e.length,'Total employees','👥','c2')}${st(act,'Active employees','✅','c1')}${st(e.length-act,'Inactive employees','⏸️','c3')}${st(nw,'New hires (30d)','🆕','c4')}${st(dp,'Departments','🏢','c5')}${st(ms.length,'Missing requirements','📄','c6')}</div><br>
<div class="card"><h2>Quick actions</h2><div class="f"><button class="b" onclick="addEmp()">+ Add employee</button><button class="b g" onclick="addGlobal('memo')">+ Create memo</button><button class="b g" onclick="addGlobal('trn')">+ Add training</button><button class="b g" onclick="go('att')">Mark attendance</button><button class="b r" onclick="clearAll()">Clear sample data</button></div></div>
<div class="card"><h2>Attendance (last 7 days)</h2>${chart(7)}</div><div class="card"><h2>Recent employees</h2><div class="w"><table><tr><th>Employee ID</th><th>Name</th><th>Department</th><th>Position</th><th>Date hired</th><th>Status</th></tr>${e.slice(-5).reverse().map(x=>`<tr onclick="go('prof','${x.id}')" style="cursor:pointer"><td>${x.id}</td><td>${esc(nm(x))}</td><td>${esc(x.dept)}</td><td>${esc(x.pos)}</td><td>${x.hired}</td><td>${tag(x.status)}</td></tr>`).join('')}</table></div></div>
<div class="card"><h2>Missing requirements</h2><div class="w"><table><tr><th>Employee</th><th>Department</th><th>Missing requirement</th><th>Status</th></tr>${ms.slice(0,10).map(([x,r])=>`<tr><td>${esc(nm(x))}</td><td>${esc(x.dept)}</td><td>${r}</td><td><span class="tag m">Missing</span></td></tr>`).join('')||'<tr><td colspan=4 class="empty">All requirements complete</td></tr>'}</table></div></div>`}
function emps(){const ds=[...new Set(D.e.map(x=>x.dept))];
return `<div class="row"><h2 style="margin:0">Employees</h2><button class="b" onclick="addEmp()">+ Add employee</button></div>
<div class="f"><input id="q" placeholder="Search by ID, name, department, position..." value="${esc(S.q)}" oninput="S.q=this.value;list()"><select onchange="S.dept=this.value;list()"><option value="">All departments</option>${ds.map(d=>`<option ${S.dept===d?'selected':''}>${esc(d)}</option>`).join('')}</select><select onchange="S.st=this.value;list()"><option value="">All statuses</option>${ST.map(d=>`<option ${S.st===d?'selected':''}>${d}</option>`).join('')}</select></div><div class="card w" id="L"></div>`}
function list(){const q=S.q.toLowerCase(),r=D.e.filter(x=>(!S.dept||x.dept===S.dept)&&(!S.st||x.status===S.st)&&(x.id+nm(x)+x.dept+x.pos).toLowerCase().includes(q));
$('#L').innerHTML=`<table><tr><th>Employee ID</th><th>Photo</th><th>Name</th><th>Department</th><th>Position</th><th>Sex</th><th>Nationality</th><th>Tribe</th><th>Blood</th><th>Residence</th><th>Date hired</th><th>Status</th><th>Contact</th><th>Actions</th></tr>${r.map(x=>`<tr><td>${x.id}</td><td><span class="ap">${x.photo?`<img src="${x.photo}">`:esc(x.first[0]+x.last[0])}</span></td><td>${esc(nm(x))}</td><td>${esc(x.dept)}</td><td>${esc(x.pos)}</td><td>${esc((x.per||{}).sex)||'-'}</td><td>${esc((x.per||{}).nat)||'-'}</td>${['tribe','blood','addr'].map(k=>`<td>${esc((x.per||{})[k])||'-'}</td>`).join('')}<td>${x.hired}</td><td>${tag(x.status)}</td><td>${esc(x.phone)}</td><td style="white-space:nowrap"><button class="b g s" onclick="go('prof','${x.id}')">Profile</button> <button class="b g s" onclick="editEmp('${x.id}')">Edit</button> <button class="b r s" onclick="arch('${x.id}')">Archive</button></td></tr>`).join('')||'<tr><td colspan=14 class="empty">No employees found</td></tr>'}</table>`}
function kv(o,d){return `<div class="kv">${d.filter(x=>x[2]!=='photo').map(([k,l])=>`<div><small>${l}</small>${esc(o[k])||'-'}</div>`).join('')}</div>`}
function yrs(h){const y=(Date.now()-new Date(h))/315576e5;return y<1?'Less than a year':Math.floor(y)+' yrs'}
function prof(){const e=E(S.id);if(!e)return emps();const t=S.tab,td=TABS.find(x=>x[0]===t);let b='';
if(t==='Overview'){const c=(a,l)=>`<div class="stat"><b>${a}</b><span>${l}</span></div>`;b=`<div class="grid">${c(REQS.length-miss(e).length+' / '+REQS.length,'Requirements')}${c(e.docs.length,'Documents')}${c(e.trn.length,'Trainings')}${c(e.memo.length,'Memos')}</div><br><div class="card"><h2>Personal information</h2><div class="fg" id="ovp">${F.per.map(f=>ov(f,e.per)).join('')}${ov(['email','Email'],e)}${ov(['phone','Mobile'],e)}</div></div><div class="card"><h2>Employment information</h2><div class="fg" id="ove">${F.emp.slice(2,7).map(f=>ov(f,e)).join('')}</div><br><button class="b" id="sb" onclick="saveOv()">Save information</button></div>`}
else if(t==='Requirements')b=`<div class="card"><h2>Requirements (${REQS.length-miss(e).length}/${REQS.length} complete)</h2>${REQS.map(r=>`<label class="ck"><input type="checkbox" ${e.req[r]?'checked':''} onchange="tg('${r}',this.checked)"><span style="flex:1">${r}</span>${e.req[r]?'<span class="tag">Complete</span>':'<span class="tag m">Missing</span>'}</label>`).join('')}</div>`;
else if(td[2]){const a=e[td[1]];b=`<div class="card"><div class="row"><h2 style="margin:0">${t}</h2><button class="b s" onclick="addItem('${td[1]}')">+ Add</button></div>${a.length?`<div class="w"><table><tr>${F[td[1]].map(f=>`<th>${f[1]}</th>`).join('')}<th></th></tr>${a.map((r,i)=>`<tr>${F[td[1]].map(f=>`<td>${esc(r[f[0]])}</td>`).join('')}<td><button class="b r s" onclick="delItem('${td[1]}',${i})">Delete</button></td></tr>`).join('')}</table></div>`:`<div class="empty">No ${t.toLowerCase()} on file.</div>`}</div>`}
else{const k=td[1],o=k==='emp'?e:e[k],has=k==='emp'||F[k].some(f=>o[f[0]]);b=`<div class="card"><div class="row"><h2 style="margin:0">${t}</h2><button class="b s" onclick="${k==='emp'?`editEmp('${e.id}')`:`editSec('${k}')`}">Edit</button></div>${has?kv(o,F[k]):`<div class="empty">No ${t.toLowerCase()} information on file.<br><br><button class="b" onclick="editSec('${k}')">Add ${t}</button></div>`}</div>`}
return `<a href="#" onclick="go('emps');return false" style="color:var(--pri)">&larr; Back to employees</a><br><br><div class="hero"><div class="av">${e.photo?`<img src="${e.photo}">`:esc(e.first[0]+e.last[0])}</div><div><h2 style="margin:0;font-size:20px">${esc(nm(e))}</h2>${esc(e.pos)} &middot; ${esc(e.dept)}<br>${tag(e.status)} <small>${e.id} &middot; ${e.type} &middot; Service: ${yrs(e.hired)}</small></div></div><div class="tabs">${TABS.map(x=>`<button class="${x[0]===t?'on':''}" onclick="S.tab='${x[0]}';render()">${x[0]}</button>`).join('')}</div>${b}`}
function form(title,defs,v,cb){const fl=defs.map(([k,l,t,o])=>`<div><label>${l}</label>${t==='photo'?`<div class="ph" id="pv">${v[k]?`<img src="${v[k]}">`:'📷'}</div><input type="hidden" id="f_${k}" value="${v[k]||''}"><span class="pk">🖼️ Gallery<input type="file" accept="image/*" onchange="pick(this)"></span><span class="pk">📷 Camera<input type="file" accept="image/*" capture="user" onchange="pick(this)"></span><button type="button" class="pk" style="border:0;cursor:pointer" onclick="cam()">🎥 Live camera</button><div id="pz" contenteditable="true" style="border:1px dashed var(--bd);padding:8px;border-radius:8px;font-size:12px;color:var(--mut);margin-top:6px">Or tap here and paste a copied photo (Ctrl+V on PC)</div><div id="pm" style="font-size:12px;color:var(--bad)"></div>`:t==='sel'?`<select id="f_${k}">${o.map(x=>{x=Array.isArray(x)?x:[x,x];return `<option value="${esc(x[0])}" ${v[k]===x[0]?'selected':''}>${esc(x[1])}</option>`}).join('')}</select>`:t==='area'?`<textarea id="f_${k}" rows="4">${esc(v[k])}</textarea>`:`<input id="f_${k}" type="${t==='date'?'date':'text'}" value="${esc(v[k])}">`}</div>`).join('');
$('#m').innerHTML=`<div class="ov" onclick="if(event.target===this)closeM()"><div class="md"><h2>${title}</h2><div class="fg">${fl}</div><div class="row" style="justify-content:flex-end;margin:14px 0 0"><button class="b g" onclick="closeM()">Cancel</button><button class="b" id="sv">Save</button></div></div></div>`;
$('#sv').onclick=()=>{const o={};defs.forEach(d=>o[d[0]]=$('#f_'+d[0]).value.trim());cb(o);save();closeM();render()}}
const closeM=()=>$('#m').innerHTML='';
const ADDF=()=>[...F.emp.slice(0,9),['sex','Sex','sel',[['','-'],'Male','Female']],['nat','Nationality'],['tribe','Tribe (Kabila)'],['blood','Blood type'],['addr','Residence (where he/she lives)'],F.emp[9]];
function addEmp(){form('Add employee',ADDF(),{nat:'Tanzanian',status:'Probationary',type:'Full-Time',hired:new Date().toISOString().slice(0,10)},o=>{if(!o.first||!o.last)return;const e=mk('EMP-'+new Date().getFullYear()+'-'+String(++D.n).padStart(4,'0'),o.first,o.last,o.dept.toUpperCase()||'GENERAL',o.pos,o.hired,o.status);Object.assign(e,{type:o.type,phone:o.phone,email:o.email,photo:o.photo});e.per={sex:o.sex,nat:o.nat,tribe:o.tribe,blood:o.blood,addr:o.addr};D.e.push(e)})}
function editEmp(id){const e=E(id);form('Edit employee',F.emp,e,o=>Object.assign(e,o))}
function editSec(k){const e=E(S.id);form('Edit',F[k],e[k],o=>e[k]=o)}
function addItem(k){const e=E(S.id);form('Add',F[k],{date:new Date().toISOString().slice(0,10)},o=>e[k].push(o))}
function delItem(k,i){ask('Delete this record?',()=>E(S.id)[k].splice(i,1))}
function addGlobal(k){form(k==='memo'?'Create memo':'Add training',[['emp','Employee','sel',D.e.map(x=>[x.id,nm(x)])],...F[k]],{date:new Date().toISOString().slice(0,10)},o=>{const e=E(o.emp);if(e)e[k].push(o)})}
function setPh(u){$('#f_photo').value=u;$('#pv').innerHTML='<img src="'+u+'">';$('#pm').textContent=''}
async function cam(){try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}),o=document.createElement('div');o.className='ov';o.style.zIndex=30;o.innerHTML='<div class="md"><video id="vd" autoplay playsinline muted style="width:100%;border-radius:12px"></video><div class="row" style="justify-content:center;margin:10px 0 0"><button class="b g" id="cx">Cancel</button><button class="b" id="cs">Capture</button></div></div>';document.body.appendChild(o);const v=$('#vd');v.srcObject=st;const stop=()=>{st.getTracks().forEach(t=>t.stop());o.remove()};$('#cx').onclick=stop;$('#cs').onclick=()=>{if(!v.videoWidth)return;const s=Math.min(1,320/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=v.videoWidth*s;c.height=v.videoHeight*s;c.getContext('2d').drawImage(v,0,0,c.width,c.height);setPh(c.toDataURL('image/jpeg',.8));stop()}}catch(e){$('#pm').textContent='Camera is blocked in this view. Use paste, or open the page in Chrome.'}}
document.addEventListener('paste',e=>{if(!$('#pv'))return;const f=[...(e.clipboardData?.files||[])].find(x=>x.type.startsWith('image'));if(f){e.preventDefault();pick({files:[f]})}});
document.addEventListener('dragover',e=>{if($('#pv'))e.preventDefault()});
document.addEventListener('drop',e=>{if(!$('#pv'))return;e.preventDefault();const f=[...e.dataTransfer.files].find(x=>x.type.startsWith('image'));if(f)pick({files:[f]})});
function pick(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,320/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.8);$('#f_photo').value=u;$('#pv').innerHTML='<img src="'+u+'">'};im.src=r.result};r.readAsDataURL(f)}
const AS=[['P','Present','#0f7a4a'],['L','Late','#d97706'],['A','Absent','#dc2626'],['V','Leave','#6366f1']],today=()=>new Date().toISOString().slice(0,10);
function chart(n){const days=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d.toISOString().slice(0,10))}
const c=days.map(d=>{const r=D.att[d]||{},o={P:0,L:0,A:0,V:0};Object.keys(r).forEach(k=>E(k)&&o[r[k]]++);return o}),mx=Math.max(1,...c.map(o=>o.P+o.L+o.A+o.V)),bw=Math.max(8,Math.floor(560/n)-6);let s='';
c.forEach((o,i)=>{let y=170;AS.forEach(a=>{const h=o[a[0]]/mx*150;y-=h;if(h)s+=`<rect x="${i*(bw+6)+30}" y="${y}" width="${bw}" height="${h}" fill="${a[2]}" rx="2"/>`});if(n<=14||i%5==0)s+=`<text x="${i*(bw+6)+30+bw/2}" y="188" font-size="10" text-anchor="middle" style="fill:var(--mut)">${days[i].slice(5)}</text>`});
return `<div class="w"><svg viewBox="0 0 ${n*(bw+6)+40} 196" style="min-width:${Math.min(n*(bw+6)+40,600)}px;width:100%;max-width:680px;display:block;margin:0 auto"><text x="2" y="24" font-size="10" style="fill:var(--mut)">${mx}</text><text x="2" y="172" font-size="10" style="fill:var(--mut)">0</text>${s}</svg></div><div class="f" style="font-size:13px">${AS.map(a=>`<span style="flex:none"><i style="display:inline-block;width:10px;height:10px;background:${a[2]};border-radius:2px"></i> ${a[1]}</span>`).join('')}</div>`}
function attv(){const d=S.d||today(),r=D.att[d]||{};
return `<div class="row"><h2 style="margin:0">Attendance</h2><input type="date" value="${d}" style="width:auto" onchange="S.d=this.value;render()"></div><div class="card"><h2>Mark attendance</h2>${D.e.filter(x=>x.status!=='Inactive').map(x=>`<div class="ck" style="flex-wrap:wrap"><span style="flex:1;min-width:150px;display:flex;align-items:center"><span class="ap">${x.photo?`<img src="${x.photo}">`:esc(x.first[0]+x.last[0])}</span>${esc(nm(x))}</span>${AS.map(a=>`<button class="b s" style="margin:2px;${r[x.id]===a[0]?'background:'+a[2]:'background:var(--pri2);color:var(--tx)'}" onclick="mark('${x.id}','${a[0]}')">${a[1]}</button>`).join('')}</div>`).join('')||'<div class="empty">Add employees first.</div>'}</div><div class="card"><h2>Attendance chart</h2><div class="f"><select onchange="S.rg=+this.value;render()">${[7,14,30].map(n=>`<option value="${n}" ${(S.rg||7)==n?'selected':''}>Last ${n} days</option>`).join('')}</select></div>${chart(S.rg||7)}</div>`}
function mark(id,s){const d=S.d||today();(D.att[d]=D.att[d]||{})[id]=s;save();render()}
function editCo(){form('Company name',[['co','Company name']],{co:D.co},o=>{if(o.co)D.co=o.co})}
function ask(t,cb){$('#m').innerHTML=`<div class="ov"><div class="md"><h2>${t}</h2><div class="row" style="justify-content:flex-end;margin:14px 0 0"><button class="b g" onclick="closeM()">Cancel</button><button class="b" id="ok">Yes</button></div></div></div>`;$('#ok').onclick=()=>{cb();save();closeM();render()}}
function clearAll(){ask('Remove all employees and attendance records? This cannot be undone.',()=>{D.e=[];D.att={};D.n=0})}
function ov([k,l,t,op],o){const v=o[k]||'';return `<div><label>${l}</label>${t==='sel'?`<select data-k="${k}">${v?'':'<option value="">-</option>'}${op.map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select>`:`<input data-k="${k}" type="${t==='date'?'date':'text'}" value="${esc(v)}">`}</div>`}
function saveOv(){const e=E(S.id);document.querySelectorAll('#ovp [data-k]').forEach(i=>{const k=i.dataset.k,v=i.value.trim();if(k==='email'||k==='phone')e[k]=v;else e.per[k]=v});document.querySelectorAll('#ove [data-k]').forEach(i=>e[i.dataset.k]=i.value.trim());save();render();const b=$('#sb');if(b)b.textContent='Saved ✓'}
function tgTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('hr_theme',t)}catch(e){}}
function tg(r,v){E(S.id).req[r]=v;save();render()}
function arch(id){ask('Mark this employee as Inactive?',()=>E(id).status='Inactive')}
render();
</script></body></html>
