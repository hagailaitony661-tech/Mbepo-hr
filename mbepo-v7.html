.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}.tabs button{flex:none;border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:6px 11px;cursor:pointer}

.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.kv small{color:var(--mut);display:block;font-size:12px}
.empty{text-align:center;color:var(--mut);padding:24px}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.md{background:var(--card);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}

.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.fg label{font-size:12px;color:var(--mut)}
.ck{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.ck input{width:auto}

.grid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat{display:flex;gap:12px;align-items:center;border-left:4px solid var(--a,#10b981);padding:14px}.stat i{font-style:normal;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:color-mix(in srgb,var(--a,#10b981) 16%,transparent);flex:none}.stat b{font-size:24px;line-height:1.1}

.b{background:linear-gradient(135deg,var(--pri),#16a34a);box-shadow:0 4px 12px #0f7a4a40;transition:.15s}.b:hover{transform:translateY(-1px)}.b.g{background:var(--pri2);box-shadow:none}.b.r{background:#fde8e6;box-shadow:none}
tr:hover td{background:var(--pri2)}th{font-size:12px;text-transform:uppercase;letter-spacing:.4px}.hero{border-radius:var(--r);box-shadow:var(--sh)}
@media(max-width:700px){header nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;box-shadow:0 -6px 20px #0002;gap:4px;flex-wrap:nowrap}header nav button.b.g{flex:1;background:transparent;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 2px;border-radius:12px}header nav button i{font-size:20px;margin:0}header nav button.b.g.on{background:var(--pri2);color:var(--pri)}main{padding-bottom:96px}.wel h1{font-size:19px}}

function per(){const m=S.pm||'week',o=S.po||0,t=new Date();t.setHours(12);const ds=[],iso=d=>d.toISOString().slice(0,10),pad=n=>String(n).padStart(2,'0');let bars,lab;
if(m==='week'){const x=new Date(t);x.setDate(x.getDate()-((x.getDay()+6)%7)+7*o);for(let i=0;i<7;i++){const d=new Date(x);d.setDate(x.getDate()+i);ds.push(iso(d))}lab=ds[0]+' \u2192 '+ds[6];bars=ds.map((d,i)=>({l:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]+' '+d.slice(8),c:cd(d)}))}
else if(m==='month'){const x=new Date(t.getFullYear(),t.getMonth()+o,1,12),y=x.getFullYear(),mo=x.getMonth(),n=new Date(y,mo+1,0).getDate();for(let i=1;i<=n;i++)ds.push(y+'-'+pad(mo+1)+'-'+pad(i));lab=x.toLocaleString('en',{month:'long'})+' '+y;bars=ds.map(d=>({l:d.slice(8),c:cd(d)}))}
else{const y=t.getFullYear()+o;lab=String(y);bars=[];for(let i=1;i<=12;i++){const l=Object.keys(D.att).filter(d=>d.startsWith(y+'-'+pad(i)));l.forEach(d=>ds.push(d));bars.push({l:'JFMAMJJASOND'[i-1],c:sumc(l)})}}
return{m,ds,bars,lab}}
